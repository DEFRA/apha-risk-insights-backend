services:
  apha-risk-insights-backend:
    build:
      context: .
      target: development
    image: apha-risk-insights-backend-development
    container_name: apha-risk-insights-backend-development
    links:
      - 'floci:floci'
      - 'mongodb:mongodb'
    depends_on:
      floci:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      PORT: 3001
      NODE_ENV: development
      MONGO_URI: mongodb://mongodb:27017/
    volumes:
      - ./src:/home/node/src
      - ./docs:/home/node/docs
      - ./package.json:/home/node/package.json
    networks:
      - apha-risk

  # floci is a replacement for localstack. It emulates AWS resources (sqs, sns, s3 etc) for local development
  # See: https://floci.io for more details
  floci:
    image: hectorvent/floci:latest-aws
    env_file:
      - 'compose/aws.env'
    environment:
      FLOCI_DEFAULT_REGION: eu-west-2
    volumes:
      - ./compose/floci/start.d:/etc/floci/init/start.d:ro
    networks:
      - apha-risk

  mongodb:
    image: mongo:7.0.28
    volumes:
      - ./compose/mongo:/docker-entrypoint-initdb.d:ro
      - mongodb-data:/data
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.hello().ok"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - apha-risk

volumes:
  mongodb-data:

networks:
  apha-risk:
    driver: bridge
    name: apha-risk
