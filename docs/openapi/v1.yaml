openapi: 3.1.0
info:
  title: International Disease Monitoring Risk API
  version: 0.1.0
  summary: Read-only access to current and historical disease risk assessments
  description: |
    API contract for International Disease Monitoring risk assessments.

    This contract reflects the data available in the `disease_risks` MongoDB
    collection.
  license:
    name: Open Government Licence v3.0
    identifier: OGL-UK-3.0
servers:
  - url: /
    description: Host serving this API
security: []
tags:
  - name: Risks
    description: Current and historical disease risk assessments
  - name: Diseases
    description: Disease codes and names used by risk assessments
paths:
  /risks:
    get:
      tags:
        - Risks
      operationId: listRisks
      summary: List current disease risk assessments
      description: |
        Returns current risk assessments ordered by disease code and then risk
        ID, both in ascending order. Historical assessments are available from
        the individual risk resource.

        All supplied filters are combined using AND. The `q` parameter performs
        a case-insensitive substring match against the disease code and disease
        name.
      parameters:
        - $ref: '#/components/parameters/DiseaseCodeQuery'
        - $ref: '#/components/parameters/StatusQuery'
        - $ref: '#/components/parameters/StrainQuery'
        - $ref: '#/components/parameters/LevelChangeQuery'
        - $ref: '#/components/parameters/SourceQuery'
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A page of current disease risk assessments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiskPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /risks/{riskId}:
    get:
      tags:
        - Risks
      operationId: getRisk
      summary: Get a disease risk assessment
      description: |
        Returns the current assessment and all past assessments for one disease
        risk record. Risk history is ordered by `dateReported`, newest first.
      parameters:
        - $ref: '#/components/parameters/RiskId'
      responses:
        '200':
          description: A disease risk assessment with its history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiskDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /diseases:
    get:
      tags:
        - Diseases
      operationId: listDiseases
      summary: List diseases used by risk assessments
      description: |
        Returns the distinct disease code and name pairs represented by the
        service. Results are ordered by disease code in ascending order.
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
      responses:
        '200':
          description: Disease reference data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Disease'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /diseases/{diseaseCode}:
    get:
      tags:
        - Diseases
      operationId: getDisease
      summary: Get a disease used by risk assessments
      parameters:
        - $ref: '#/components/parameters/DiseaseCode'
      responses:
        '200':
          description: Disease reference data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Disease'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  parameters:
    RiskId:
      name: riskId
      in: path
      required: true
      description: UUID of the disease risk record
      schema:
        type: string
        format: uuid
      example: 80d1d0e4-381f-4a68-887b-fd5c5556943d
    DiseaseCode:
      name: diseaseCode
      in: path
      required: true
      description: Stable disease code
      schema:
        $ref: '#/components/schemas/DiseaseCode'
      example: ASF
    DiseaseCodeQuery:
      name: diseaseCode
      in: query
      description: Return assessments for this disease code
      schema:
        $ref: '#/components/schemas/DiseaseCode'
      example: ASF
    StatusQuery:
      name: status
      in: query
      description: Return assessments with this current risk status
      schema:
        $ref: '#/components/schemas/RiskStatus'
      example: high
    StrainQuery:
      name: strain
      in: query
      description: Return assessments with this exact strain value
      schema:
        type: string
        minLength: 1
        maxLength: 200
      example: Genotype II
    LevelChangeQuery:
      name: levelChange
      in: query
      description: Return assessments with this current direction of change
      schema:
        $ref: '#/components/schemas/LevelChange'
      example: deteriorating
    SourceQuery:
      name: source
      in: query
      description: Return assessments with this exact current source value
      schema:
        type: string
        minLength: 1
        maxLength: 500
    SearchQuery:
      name: q
      in: query
      description: |
        Case-insensitive substring to find in a disease code or disease name
      schema:
        type: string
        minLength: 1
        maxLength: 100
      example: swine
    Page:
      name: page
      in: query
      description: Page number, starting at 1
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      description: Maximum number of assessments returned in one page
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
  responses:
    BadRequest:
      description: The request parameters are invalid
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: The requested resource does not exist
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Too many requests were made in a given period
      headers:
        Retry-After:
          description: Seconds to wait before making another request
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalServerError:
      description: The service could not complete the request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    RiskSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - disease
        - risk
      properties:
        id:
          type: string
          format: uuid
          description: UUID of the disease risk record
          example: 80d1d0e4-381f-4a68-887b-fd5c5556943d
        disease:
          $ref: '#/components/schemas/Disease'
        strain:
          type: string
          minLength: 1
          description: Strain recorded for this assessment, when available
          example: Genotype II
        risk:
          $ref: '#/components/schemas/RiskAssessment'
    RiskDetail:
      type: object
      additionalProperties: false
      required:
        - id
        - disease
        - risk
        - riskHistory
      properties:
        id:
          type: string
          format: uuid
          description: UUID of the disease risk record
          example: 80d1d0e4-381f-4a68-887b-fd5c5556943d
        disease:
          $ref: '#/components/schemas/Disease'
        strain:
          type: string
          minLength: 1
          description: Strain recorded for this assessment, when available
          example: Genotype II
        risk:
          $ref: '#/components/schemas/RiskAssessment'
        riskHistory:
          type: array
          description: Past assessments ordered by date reported, newest first
          items:
            $ref: '#/components/schemas/RiskAssessment'
    RiskAssessment:
      type: object
      additionalProperties: false
      required:
        - status
        - previousStatus
        - levelChange
        - source
        - dateReported
      properties:
        status:
          $ref: '#/components/schemas/RiskStatus'
        previousStatus:
          description: Previous risk status, or null when no prior assessment exists
          oneOf:
            - $ref: '#/components/schemas/RiskStatus'
            - type: 'null'
        levelChange:
          $ref: '#/components/schemas/LevelChange'
        source:
          type: string
          minLength: 1
          description: Source used for the assessment
          example: International Disease Monitoring report
        dateReported:
          type: string
          format: date-time
          description: Date and time recorded for the assessment
          example: '2026-09-30T00:00:00Z'
    RiskStatus:
      type: string
      description: Assessed disease risk status
      enum:
        - negligible
        - very low
        - low
        - medium
        - high
    LevelChange:
      type: string
      description: Direction of change from the previous risk status
      enum:
        - deteriorating
        - no change
        - improving
        - undetermined
    Disease:
      oneOf:
        - $ref: '#/components/schemas/FootAndMouthDisease'
        - $ref: '#/components/schemas/AfricanSwineFever'
        - $ref: '#/components/schemas/HighlyPathogenicAvianInfluenza'
        - $ref: '#/components/schemas/AfricanHorseSickness'
        - $ref: '#/components/schemas/Bluetongue'
      discriminator:
        propertyName: code
        mapping:
          FMD: '#/components/schemas/FootAndMouthDisease'
          ASF: '#/components/schemas/AfricanSwineFever'
          HPAI: '#/components/schemas/HighlyPathogenicAvianInfluenza'
          AHS: '#/components/schemas/AfricanHorseSickness'
          BTV: '#/components/schemas/Bluetongue'
    DiseaseCode:
      type: string
      enum:
        - FMD
        - ASF
        - HPAI
        - AHS
        - BTV
    DiseaseBase:
      type: object
      additionalProperties: false
      required:
        - code
        - name
      properties:
        code:
          $ref: '#/components/schemas/DiseaseCode'
        name:
          type: string
    FootAndMouthDisease:
      allOf:
        - $ref: '#/components/schemas/DiseaseBase'
        - type: object
          properties:
            code:
              const: FMD
            name:
              const: Foot and Mouth Disease
    AfricanSwineFever:
      allOf:
        - $ref: '#/components/schemas/DiseaseBase'
        - type: object
          properties:
            code:
              const: ASF
            name:
              const: African Swine Fever
    HighlyPathogenicAvianInfluenza:
      allOf:
        - $ref: '#/components/schemas/DiseaseBase'
        - type: object
          properties:
            code:
              const: HPAI
            name:
              const: Highly Pathogenic Avian Influenza
    AfricanHorseSickness:
      allOf:
        - $ref: '#/components/schemas/DiseaseBase'
        - type: object
          properties:
            code:
              const: AHS
            name:
              const: African Horse Sickness
    Bluetongue:
      allOf:
        - $ref: '#/components/schemas/DiseaseBase'
        - type: object
          properties:
            code:
              const: BTV
            name:
              const: Bluetongue
    RiskPage:
      type: object
      additionalProperties: false
      required:
        - items
        - page
        - pageSize
        - totalItems
        - totalPages
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RiskSummary'
        page:
          type: integer
          minimum: 1
          description: Current page number
        pageSize:
          type: integer
          minimum: 1
          maximum: 200
          description: Maximum number of items in the page
        totalItems:
          type: integer
          minimum: 0
          description: Total number of matching risk records
        totalPages:
          type: integer
          minimum: 0
          description: Total number of pages for the current page size
    Problem:
      type: object
      additionalProperties: false
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri-reference
          description: URI reference identifying the problem type
          example: about:blank
        title:
          type: string
          description: Short summary of the problem
          example: Bad Request
        status:
          type: integer
          minimum: 400
          maximum: 599
          description: HTTP status code
          example: 400
        detail:
          type: string
          description: Explanation specific to this occurrence
        instance:
          type: string
          format: uri-reference
          description: URI reference identifying this occurrence
